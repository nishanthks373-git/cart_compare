name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - name: Firebase config (secret, committed file, or placeholder)
        working-directory: android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "Using google-services.json from the GOOGLE_SERVICES_JSON secret"
          elif [ -f google-services.json ]; then
            echo "Using committed android/app/google-services.json"
          else
            echo "::warning::No google-services.json: building with a placeholder. The app installs but can't reach the backend."
            cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "cart-compare-placeholder",
              "storage_bucket": "cart-compare-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.cartcompare.app" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyA0000000000000000000000000000000" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
          fi
      - name: Build debug APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir /tmp/lg && { grep -E '^e: ' /tmp/build.log; grep -A20 'What went wrong' /tmp/build.log; tail -n 80 /tmp/build.log; } > /tmp/lg/build.log || true
          cd /tmp/lg && git init -q -b build-log
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -qm log && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-log
      - uses: actions/upload-artifact@v4
        with:
          name: CartCompare-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to the apk-build branch
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/CartCompare.apk
          cd /tmp/out && git init -q -b apk-build
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Built APK"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-build

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm test
